name: OpenWrt ARMv7

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/openwrt-armv7.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build armv7-unknown-linux-musleabihf
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: openwrt-armv7-musl
          cache-all-crates: "true"

      - name: Build OpenWrt binary
        run: >-
          cross build --locked --release
          --target armv7-unknown-linux-musleabihf
          --no-default-features

      - name: Verify static ARMv7 binary
        shell: bash
        run: |
          set -euo pipefail
          binary=target/armv7-unknown-linux-musleabihf/release/daanio
          file "$binary"
          readelf -h "$binary"
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "OpenWrt binary unexpectedly has dynamic library dependencies" >&2
            readelf -d "$binary" >&2
            exit 1
          fi
          cross run --locked --release \
            --target armv7-unknown-linux-musleabihf \
            --no-default-features -- --version

      - name: Package OpenWrt artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/armv7-unknown-linux-musleabihf/release/daanio \
            dist/daanio-openwrt-armv7
          chmod +x dist/daanio-openwrt-armv7
          tar -C dist -czf dist/daanio-openwrt-armv7.tar.gz \
            daanio-openwrt-armv7
          sha256sum dist/daanio-openwrt-armv7.tar.gz > \
            dist/daanio-openwrt-armv7.tar.gz.sha256

      - name: Upload OpenWrt artifact
        uses: actions/upload-artifact@v4
        with:
          name: daanio-openwrt-armv7
          path: |
            dist/daanio-openwrt-armv7.tar.gz
            dist/daanio-openwrt-armv7.tar.gz.sha256
          if-no-files-found: error
