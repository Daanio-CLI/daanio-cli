name: OpenWrt ARMv7

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/openwrt-armv7.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - src/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build armv7-unknown-linux-musleabihf
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: openwrt-armv7-musl
          cache-all-crates: "true"

      - name: Restore OpenWrt target cache
        uses: actions/cache/restore@v4
        with:
          path: target/armv7-unknown-linux-musleabihf
          key: openwrt-armv7-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            openwrt-armv7-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-

      - name: Build OpenWrt binary
        shell: bash
        run: |
          set -o pipefail
          cross build --locked --release \
            --target armv7-unknown-linux-musleabihf \
            --no-default-features 2>&1 | tee openwrt-build.log

      - name: Report cross-build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## OpenWrt cross-build failure"
            echo
            echo '```text'
            tail -n 160 openwrt-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=$(sed $'s/\033\\[[0-9;]*m//g' openwrt-build.log | tail -c 3500 | \
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
          printf '::error title=OpenWrt cross-build failed::%s\n' "$message"

      - name: Save OpenWrt target cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/armv7-unknown-linux-musleabihf
          key: openwrt-armv7-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

      - name: Verify static ARMv7 binary
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          {
            binary=target/armv7-unknown-linux-musleabihf/release/daanio
            file "$binary"
            readelf -h "$binary"
            if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
              echo "OpenWrt binary unexpectedly has dynamic library dependencies" >&2
              readelf -d "$binary" >&2
              exit 1
            fi
            cross run --locked --release \
              --target armv7-unknown-linux-musleabihf \
              --no-default-features -- --version
          } 2>&1 | tee openwrt-verify.log

      - name: Report verification failure
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## OpenWrt verification failure"
            echo
            echo '```text'
            tail -n 100 openwrt-verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=$(sed $'s/\033\\[[0-9;]*m//g' openwrt-verify.log | tail -c 3500 | \
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
          printf '::error title=OpenWrt verification failed::%s\n' "$message"

      - name: Package OpenWrt artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/armv7-unknown-linux-musleabihf/release/daanio \
            dist/daanio-openwrt-armv7
          chmod +x dist/daanio-openwrt-armv7
          tar -C dist -czf dist/daanio-openwrt-armv7.tar.gz \
            daanio-openwrt-armv7
          sha256sum dist/daanio-openwrt-armv7.tar.gz > \
            dist/daanio-openwrt-armv7.tar.gz.sha256

      - name: Upload OpenWrt artifact
        uses: actions/upload-artifact@v4
        with:
          name: daanio-openwrt-armv7
          path: |
            dist/daanio-openwrt-armv7.tar.gz
            dist/daanio-openwrt-armv7.tar.gz.sha256
          if-no-files-found: error
